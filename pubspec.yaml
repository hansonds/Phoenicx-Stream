name: phoenicx_stream
description: Phoenicx Stream - play your TorBox library with TMDB artwork. No server needed.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  window_manager: ^0.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
